# IntelliJ Platform Artifacts Repositories -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html

pluginGroup=com.redhat.devtools.intellij
pluginName=LSP4IJ
pluginRepositoryUrl=https://github.com/redhat-developer/lsp4ij

# SemVer format -> https://semver.org
pluginVersion=0.30.2-SNAPSHOT

# Supported build number ranges and IntelliJ Platform versions -> https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
pluginSinceBuild=251
#pluginUntilBuild=243.*

# IntelliJ Platform Properties -> https://plugins.jetbrains.com/docs/intellij/tools-gradle-intellij-plugin.html#configuration-intellij-extension
platformType=IC
platformVersion=2025.1
platformBundledPlugins=org.jetbrains.plugins.textmate,com.intellij.properties,org.jetbrains.plugins.terminal,com.intellij.modules.json

# Plugin Dependencies -> https://plugins.jetbrains.com/docs/intellij/plugin-dependencies.html
platformPlugins=

# Gradle Releases -> https://github.com/gradle/gradle/releases
gradleVersion=9.9.2
channel=nightly
# LSP4J releases all its modules, the debug (DAP) ones included, at one version
lsp4jVersion=1.0.0
flexmarkVersion=0.64.8
# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency=false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true

# A download that a repository refuses with a server error or "429 Too Many Requests", as Maven Central does when CI
# runners ask too often, is tried 6 times, 2, 4, 8, 16 and 32 seconds apart, instead of Gradle's 3 times in 3 seconds
systemProp.org.gradle.internal.network.retry.max.attempts=6
systemProp.org.gradle.internal.network.retry.initial.backOff=2000

# Required for build starting in 2025.1
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
