[versions]
# libraries
junit = "4.13.2"
junit-jupiter = "5.10.3"

# plugins
testlogger = "4.0.0"
# The plugin runs against the Kotlin stdlib bundled with the IDE (kotlin.stdlib.default.dependency=false), which is
# 2.1.10 in IntelliJ 2025.1 (pluginSinceBuild=251): build.gradle.kts sets apiVersion/languageVersion 2.1, which a
# newer Kotlin compiler accepts as long as it supports language version 2.1.
kotlin = "2.3.21"
changelog = "2.5.0"
gradleIntelliJPlugin = "2.20.0"
kover = "0.9.11"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit-jupiter" }
junit-vintage-engine = { group = "org.junit.vintage", name = "junit-vintage-engine", version.ref = "junit-jupiter" }

[plugins]
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
gradleIntelliJPlugin = { id = "org.jetbrains.intellij.platform", version.ref = "gradleIntelliJPlugin" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
testLogger = { id = "com.adarshr.test-logger", version.ref = "testlogger" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }

