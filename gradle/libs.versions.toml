[versions]
# libraries
junit = "4.13.2"
junit-jupiter = "5.10.3"

# plugins
testlogger = "4.0.0"
# Pinned to 2.3.x: Kotlin 2.4 no longer accepts apiVersion/languageVersion 1.9. API 1.9 is required because the
# plugin runs against the Kotlin stdlib bundled with the IDE (kotlin.stdlib.default.dependency=false), which is
# 1.9.24 in IntelliJ 2024.2 (pluginSinceBuild=242). Moving past 2.3.x means raising pluginSinceBuild.
kotlin = "2.3.21"
changelog = "2.5.0"
gradleIntelliJPlugin = "2.19.0"
kover = "0.9.11"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit-jupiter" }
junit-vintage-engine = { group = "org.junit.vintage", name = "junit-vintage-engine", version.ref = "junit-jupiter" }

[plugins]
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
gradleIntelliJPlugin = { id = "org.jetbrains.intellij.platform", version.ref = "gradleIntelliJPlugin" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
testLogger = { id = "com.adarshr.test-logger", version.ref = "testlogger" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }

