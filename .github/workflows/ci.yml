# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle
on:
  # Trigger the workflow on pushes to only the 'main' branch (this avoids duplicate checks being run e.g., for dependabot pull requests)
  push:
    branches: [ main ]
  # Trigger the workflow on any pull request
  pull_request:

jobs:
  # Run tests and upload a code coverage report
  test:
    name: Test (${{ matrix.os }}${{ matrix.platformVersion && format(', {0}', matrix.platformVersion) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        # The platform version of gradle.properties
        platformVersion: [ '' ]
        include:
          # Two more releases, on Linux only, each as a job of its own that runs alongside the others:
          # IntelliJ IDEA Community 2025.3, and the newest release, 2026.3, of the unified IntelliJ IDEA (IU)
          - os: ubuntu-latest
            platformVersion: '2025.3'
          - os: ubuntu-latest
            platformVersion: '2026.3'
            platformType: IU
    env:
        NO_FS_ROOTS_ACCESS_CHECK: true
    steps:

      # Check out current repository
      - name: Fetch Sources
        uses: actions/checkout@v7

      # Set up Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # Run tests
      - name: Run Tests
        run: ./gradlew check ${{ matrix.platformVersion && format('-PplatformVersion={0}', matrix.platformVersion) || '' }} ${{ matrix.platformType && format('-PplatformType={0}', matrix.platformType) || '' }}

      # Collect Tests Result
      - name: Collect Tests Result
        if: ${{ success() || failure()}}
        uses: actions/upload-artifact@v7
        with:
          name: tests-result-${{runner.os}}${{ matrix.platformVersion && format('-{0}', matrix.platformVersion) || '' }}
          path: ${{ github.workspace }}/build/reports/tests

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7.1.1
        if: runner.os == 'Linux' && matrix.platformVersion == ''
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: redhat-developer/lsp4ij
          files: ${{ github.workspace }}/build/reports/kover/report.xml