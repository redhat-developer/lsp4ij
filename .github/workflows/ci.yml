# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle
on:
  # Trigger the workflow on pushes to only the 'main' branch (this avoids duplicate checks being run e.g., for dependabot pull requests)
  push:
    branches: [ main ]
  # Trigger the workflow on any pull request
  pull_request:

# A new push to a pull request cancels the runs of its older commits. A push to main gets a group of its own, since a
# group keeps one pending run only and cancels any other: every commit of main is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Whether a pull request, or a push to main, changes only documentation, which needs no tests
  changes:
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read

  # Run tests and upload a code coverage report
  test:
    name: Test (${{ matrix.os }}${{ matrix.platformVersion && format(', {0}', matrix.platformVersion) || '' }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ matrix.os }}

    # Codecov authenticates uploads with a short-lived OIDC token instead of a
    # long-lived CODECOV_TOKEN. Fork PRs cannot request an id-token, so they keep
    # using Codecov's tokenless path (owner:branch) as before.
    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        # The platform version of gradle.properties: IntelliJ IDEA Community 2025.1, the oldest that LSP4IJ supports
        platformVersion: [ '' ]
        include:
          # Two more releases, on Linux only, each as a job of its own that runs alongside the others:
          # IntelliJ IDEA Community 2025.3, and the newest release, 2026.3, of the unified IntelliJ IDEA (IU)
          - os: ubuntu-latest
            platformVersion: '2025.3'
          - os: ubuntu-latest
            platformVersion: '2026.3'
            platformType: IU
    env:
        NO_FS_ROOTS_ACCESS_CHECK: true
    steps:

      # Check out current repository
      - name: Fetch Sources
        uses: actions/checkout@v7

      # Set up Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # Leaves the extracted IDEs, Gradle's artifact transforms of up to 4 GB a job, out of the Actions cache. With
          # them, the entries that the jobs save on main exceed the repository's 10 GB, and GitHub evicts the other jobs'
          # downloads, so that each job fetches them again, until Maven Central answers "429 Too Many Requests". Gradle
          # extracts an IDE again from its cached download, without a network access.
          gradle-home-cache-excludes: |
            caches/transforms-4
            caches/*/transforms

      # Run tests. In the 490 runs from 2026-11-11 to 11-25, this step took at most 23 minutes, on macOS (20 with an empty
      # Gradle cache), 16 on Linux and 14 on Windows. When test after test fails at a wait, as when each waits 30 s for a
      # language server that doesn't start, the step stops after 45 minutes instead of running for up to GitHub's
      # 6 hours. The log shows each test that failed until then, with its error.
      # A pull request leaves out the plugin's searchable options, which no test reads, and which start an IDE when the
      # build cache hasn't got them. A push to main builds them, as do the Build Plugin zip workflow and releases.
      # GitHub's Linux and Windows runners (4 CPUs, 16 GB) run 3 test JVMs, where the CPUs would give 2. On #2291, at
      # least 4.7 GB stayed available and no swap was used, with the 4 JVMs of the IU job, and the jobs took 0.4 to 2
      # minutes less on Linux and 1.6 on Windows. The build's own default, as used locally, stays at half the CPUs.
      - name: Run Tests
        timeout-minutes: 45
        run: ./gradlew check ${{ matrix.platformVersion && format('-PplatformVersion={0}', matrix.platformVersion) || '' }} ${{ matrix.platformType && format('-PplatformType={0}', matrix.platformType) || '' }} ${{ github.event_name == 'pull_request' && '-PbuildSearchableOptions=false' || '' }} ${{ (runner.os == 'Linux' || runner.os == 'Windows') && '-PtestForks=3' || '' }}

      # Collect Tests Result
      - name: Collect Tests Result
        if: ${{ success() || failure()}}
        uses: actions/upload-artifact@v7
        with:
          name: tests-result-${{runner.os}}${{ matrix.platformVersion && format('-{0}', matrix.platformVersion) || '' }}
          path: ${{ github.workspace }}/build/reports/tests

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7.1.1
        if: runner.os == 'Linux' && matrix.platformVersion == ''
        with:
          use_oidc: true
          slug: redhat-developer/lsp4ij
          files: ${{ github.workspace }}/build/reports/kover/report.xml