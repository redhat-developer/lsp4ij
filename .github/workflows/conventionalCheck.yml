name: "Conventional Commits PR Check"

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

# A new push to a pull request, or an edit of its title, cancels the check of the older one
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@d2ab30dcffc66150340abb5b947d518a3c3ce9cb #v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}