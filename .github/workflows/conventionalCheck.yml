name: "Conventional Commits PR Check"

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

# No concurrency group: a run that a newer one cancels stays on the commit as a failed check, and this check takes a
# few seconds (#2066)

jobs:
  main:
    # An edit of the description alone doesn't change the title that this checks
    if: github.event.action != 'edited' || github.event.changes.title != null
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@d2ab30dcffc66150340abb5b947d518a3c3ce9cb #v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}