# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Latest IJ

on:
  schedule:
  - cron: "0 0 * * *"
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      # Check out current repository
      - name: Fetch Sources
        uses: actions/checkout@v7

      # Set up Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # The newest build of the unified IntelliJ IDEA (IU): the current EAP if there is one, else the newest release.
      # Since 2025.3 there is no IntelliJ IDEA Community (IC) any more, so only IU has the newest builds.
      - name: Find the newest IntelliJ IDEA
        id: latest
        run: |
          ./gradlew intellijPlatformDiscover --kind=releases --type=IU --output=build/intellij-releases.json
          LATEST=$(jq -r '.data.releases | map(select(.buildNumber | test("^[0-9]+(\\.[0-9]+)*$"))) | max_by(.buildNumber | split(".") | map(tonumber)) | .buildNumber // empty' build/intellij-releases.json)
          if [ -z "$LATEST" ]; then
            echo "::error::No IntelliJ IDEA (IU) release found in build/intellij-releases.json"
            exit 1
          fi
          echo "Newest IntelliJ IDEA build: $LATEST"
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Build with Gradle
        run: ./gradlew check -PplatformType=IU -PplatformVersion=${{ steps.latest.outputs.version }}

      - name: Collect Tests Result
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: |
            path: ${{ github.workspace }}/build/reports/tests
            path: ${{ github.workspace }}/build/jacoco/