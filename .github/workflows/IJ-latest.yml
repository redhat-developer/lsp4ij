# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Latest IJ

on:
  schedule:
  - cron: "0 0 * * *"
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      # Check out current repository
      - name: Fetch Sources
        uses: actions/checkout@v7

      # Set up Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # The newest build of the unified IntelliJ IDEA (IU): the current EAP if there is one, else the newest release.
      # Since 2025.3 there is no IntelliJ IDEA Community (IC) any more, so only IU has the newest builds.
      # build.gradle.kts takes the IDE from the IntelliJ Maven repository (useInstaller = false), where a release has
      # its version, such as 2026.3, and an EAP, RC or other preview build is '<build number>-EAP-SNAPSHOT'.
      - name: Find the newest IntelliJ IDEA
        id: latest
        run: |
          RELEASES=build/intellij-releases.json
          ./gradlew intellijPlatformDiscover --kind=releases --type=IU --output=$RELEASES
          # The releases, newest build first
          SORTED='.data.releases
            | map(select(.buildNumber | test("^[0-9]+(\\.[0-9]+)*$")))
            | sort_by(.buildNumber | split(".") | map(tonumber)) | reverse'
          # One build as "<build number>  <version>  <channel>", such as "263.8311.30  2026.3.1  EAP"
          ROW='[.buildNumber, .version, .channel]'
          LINE="$ROW | join(\"  \")"

          echo "The 10 newest IntelliJ IDEA (IU) builds:"
          jq -r "$SORTED | .[:10][] | $ROW | @tsv" $RELEASES | column -t
          echo

          NEWEST=$(jq -c "$SORTED | first // empty" $RELEASES)
          if [ -z "$NEWEST" ]; then
            echo "::error::No IntelliJ IDEA (IU) release found in $RELEASES"
            exit 1
          fi
          LATEST=$(echo "$NEWEST" | jq -r 'if .channel == "RELEASE" then .version else .buildNumber + "-EAP-SNAPSHOT" end')

          echo "Newest IntelliJ IDEA: $(echo "$NEWEST" | jq -r "$LINE")"
          echo "Platform version for Gradle: $LATEST"
          echo "Tested against IntelliJ IDEA \`$(echo "$NEWEST" | jq -r "$LINE")\`, platform version \`$LATEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"

          # ci.yml tests pull requests against a fixed IntelliJ IDEA (IU) release, so that a new release does not turn
          # them red. Warn, without failing, when a newer release is out, so that someone updates ci.yml.
          NEWEST_RELEASE=$(jq -r "$SORTED | map(select(.channel == \"RELEASE\")) | first | .version // empty" $RELEASES)
          # Every IU release that ci.yml tests, the highest of them counts. A matrix entry without platformType or
          # platformVersion takes the one of gradle.properties.
          DEFAULT_TYPE=$(sed -n 's/^platformType=//p' gradle.properties)
          DEFAULT_VERSION=$(sed -n 's/^platformVersion=//p' gradle.properties)
          CI_RELEASE=$(DEFAULT_TYPE="$DEFAULT_TYPE" DEFAULT_VERSION="$DEFAULT_VERSION" yq '
            .jobs[].strategy.matrix
            | ((.platformVersion // [""]) | map({"platformVersion": .})) + (.include // [])
            | .[]
            | select((.platformType // strenv(DEFAULT_TYPE)) == "IU")
            | (.platformVersion // "") | (select(. != "") // strenv(DEFAULT_VERSION))
          ' .github/workflows/ci.yml | grep -v '^$' | sort -V | tail -n 1)
          echo "Newest IntelliJ IDEA release: ${NEWEST_RELEASE:-none}, ci.yml tests: ${CI_RELEASE:-none}"
          if [ -z "$NEWEST_RELEASE" ] || [ -z "$CI_RELEASE" ]; then
            echo "::warning::Could not compare the IntelliJ IDEA release of ci.yml (${CI_RELEASE:-not found}) with the newest release (${NEWEST_RELEASE:-not found})"
          elif [ "$NEWEST_RELEASE" != "$CI_RELEASE" ] && [ "$(printf '%s\n' "$CI_RELEASE" "$NEWEST_RELEASE" | sort -V | tail -n 1)" = "$NEWEST_RELEASE" ]; then
            MESSAGE="ci.yml tests IntelliJ IDEA $CI_RELEASE, but the newest release is $NEWEST_RELEASE. Update its matrix entry with platformType IU."
            echo "::warning title=ci.yml is behind::$MESSAGE"
            echo "> [!WARNING]" >> "$GITHUB_STEP_SUMMARY"
            echo "> $MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build with Gradle
        run: ./gradlew check -PplatformType=IU -PplatformVersion=${{ steps.latest.outputs.version }}

      - name: Collect Tests Result
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: |
            path: ${{ github.workspace }}/build/reports/tests
            path: ${{ github.workspace }}/build/jacoco/