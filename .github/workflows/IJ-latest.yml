# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Latest IJ

on:
  schedule:
  - cron: "0 0 * * *"
  workflow_dispatch:

jobs:

  # Finds the newest IntelliJ IDEA build, which the job build tests, whether ci.yml is behind the newest release,
  # which the job newest-release then tests, and the supported releases that neither tests, for supported-releases
  discover:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.latest.outputs.version }}
      behind: ${{ steps.latest.outputs.behind }}
      newest-release: ${{ steps.latest.outputs.newest-release }}
      ci-release: ${{ steps.latest.outputs.ci-release }}
      untested-releases: ${{ steps.latest.outputs.untested-releases }}

    steps:
      # Check out current repository
      - name: Fetch Sources
        uses: actions/checkout@v7

      # Set up Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # Leaves the extracted IDEs out of the Actions cache, see ci.yml
          gradle-home-cache-excludes: |
            caches/transforms-4
            caches/*/transforms

      # The newest build of the unified IntelliJ IDEA (IU): the current EAP if there is one, else the newest release.
      # From 2025.3 on, the list of releases has only IntelliJ IDEA (IU), so only IU has the newest builds; the IntelliJ
      # Maven repository still has IC.
      # build.gradle.kts takes the IDE from the IntelliJ Maven repository (useInstaller = false), where a release has
      # its version, such as 2026.3, and an EAP, RC or other preview build is '<build number>-EAP-SNAPSHOT'.
      - name: Find the newest IntelliJ IDEA
        id: latest
        run: |
          RELEASES=build/intellij-releases.json
          ./gradlew intellijPlatformDiscover --kind=releases --type=IU --output=$RELEASES
          # The releases, newest build first
          SORTED='.data.releases
            | map(select(.buildNumber | test("^[0-9]+(\\.[0-9]+)*$")))
            | sort_by(.buildNumber | split(".") | map(tonumber)) | reverse'
          # One build as "<build number>  <version>  <channel>", such as "263.8311.30  2026.3.1  EAP"
          ROW='[.buildNumber, .version, .channel]'
          LINE="$ROW | join(\"  \")"

          echo "The 10 newest IntelliJ IDEA (IU) builds:"
          jq -r "$SORTED | .[:10][] | $ROW | @tsv" $RELEASES | column -t
          echo

          NEWEST=$(jq -c "$SORTED | first // empty" $RELEASES)
          if [ -z "$NEWEST" ]; then
            echo "::error::No IntelliJ IDEA (IU) release found in $RELEASES"
            exit 1
          fi
          LATEST=$(echo "$NEWEST" | jq -r 'if .channel == "RELEASE" then .version else .buildNumber + "-EAP-SNAPSHOT" end')

          echo "Newest IntelliJ IDEA: $(echo "$NEWEST" | jq -r "$LINE")"
          echo "Platform version for Gradle: $LATEST"
          echo "Tested against IntelliJ IDEA \`$(echo "$NEWEST" | jq -r "$LINE")\`, platform version \`$LATEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"

          # ci.yml tests pull requests against a fixed IntelliJ IDEA (IU) release, so that a new release does not turn
          # them red. Warn, without failing, when a newer release is out, so that someone updates ci.yml.
          NEWEST_RELEASE=$(jq -r "$SORTED | map(select(.channel == \"RELEASE\")) | first | .version // empty" $RELEASES)
          # Every IU release that ci.yml tests, the highest of them counts. A matrix entry without platformType or
          # platformVersion takes the one of gradle.properties.
          DEFAULT_TYPE=$(yq -p=props -o=yaml '.platformType // ""' gradle.properties)
          DEFAULT_VERSION=$(yq -p=props -o=yaml '.platformVersion // ""' gradle.properties)
          CI_RELEASE=$(DEFAULT_TYPE="$DEFAULT_TYPE" DEFAULT_VERSION="$DEFAULT_VERSION" yq '
            .jobs[].strategy.matrix
            | ((.platformVersion // [""]) | map({"platformVersion": .})) + (.include // [])
            | .[]
            | select((.platformType // strenv(DEFAULT_TYPE)) == "IU")
            | (.platformVersion // "") | (select(. != "") // strenv(DEFAULT_VERSION))
          ' .github/workflows/ci.yml | grep -v '^$' | sort -V | tail -n 1)
          echo "Newest IntelliJ IDEA release: ${NEWEST_RELEASE:-none}, ci.yml tests: ${CI_RELEASE:-none}"
          if [ -z "$NEWEST_RELEASE" ] || [ -z "$CI_RELEASE" ]; then
            echo "::warning::Could not compare the IntelliJ IDEA release of ci.yml (${CI_RELEASE:-not found}) with the newest release (${NEWEST_RELEASE:-not found})"
          elif [ "$NEWEST_RELEASE" != "$CI_RELEASE" ] && [ "$(printf '%s\n' "$CI_RELEASE" "$NEWEST_RELEASE" | sort -V | tail -n 1)" = "$NEWEST_RELEASE" ]; then
            MESSAGE="ci.yml tests IntelliJ IDEA $CI_RELEASE, but the newest release is $NEWEST_RELEASE. The job newest-release tests it, and says whether ci.yml can move to it."
            echo "::warning title=ci.yml is behind::$MESSAGE"
            {
              echo "> [!WARNING]"
              echo "> $MESSAGE"
            } >> "$GITHUB_STEP_SUMMARY"
            {
              echo "behind=true"
              echo "newest-release=$NEWEST_RELEASE"
              echo "ci-release=$CI_RELEASE"
            } >> "$GITHUB_OUTPUT"
          fi

          # The newest build of each IntelliJ IDEA (IU) release that LSP4IJ supports, from pluginSinceBuild on, and that
          # neither ci.yml, of any type, nor the job newest-release tests, such as 2025.2, 2026.1 and 2026.2. A release
          # is its branch: 252 for 2025.2 and its patch releases. The job supported-releases tests them.
          SINCE_BUILD=$(yq -p=props -o=yaml '.pluginSinceBuild' gradle.properties)
          CI_VERSIONS=$(DEFAULT_VERSION="$DEFAULT_VERSION" yq '
            .jobs[].strategy.matrix
            | ((.platformVersion // [""]) | map({"platformVersion": .})) + (.include // [])
            | .[]
            | (.platformVersion // "") | (select(. != "") // strenv(DEFAULT_VERSION))
          ' .github/workflows/ci.yml | jq -R . | jq -sc 'map(select(. != "")) | unique')
          # The branch of a version: 2025.3 and 2025.3.6.3 -> 253
          BRANCH='split(".") | (.[0][2:] + .[1]) | tonumber'
          UNTESTED=$(jq -c --argjson since "$SINCE_BUILD" --argjson ci "$CI_VERSIONS" --arg newest "$NEWEST_RELEASE" "
            ([\$ci[] | $BRANCH] + (if \$newest == \"\" then [] else [\$newest | $BRANCH] end)) as \$tested
            | $SORTED
            | map(select(.channel == \"RELEASE\") | .branch = (.buildNumber | split(\".\")[0] | tonumber))
            | map(select(.branch >= \$since and (.branch as \$b | \$tested | any(. == \$b) | not)))
            | group_by(.branch)
            | map(max_by(.buildNumber | split(\".\") | map(tonumber)) | .version)
          " $RELEASES)
          UNTESTED_LIST=$(echo "$UNTESTED" | jq -r 'if length == 0 then "none" else join(", ") end')
          echo "Supported releases (from build $SINCE_BUILD) that ci.yml ($CI_VERSIONS) and newest-release don't test: $UNTESTED_LIST"
          echo "Supported releases that ci.yml doesn't test, tested by the job supported-releases: $UNTESTED_LIST" >> "$GITHUB_STEP_SUMMARY"
          echo "untested-releases=$UNTESTED" >> "$GITHUB_OUTPUT"

  # Tests the newest build, often an EAP
  build:
    needs: discover
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # Leaves the extracted IDEs out of the Actions cache, see ci.yml
          gradle-home-cache-excludes: |
            caches/transforms-4
            caches/*/transforms

      - name: Build with Gradle
        run: ./gradlew check -PplatformType=IU -PplatformVersion=${{ needs.discover.outputs.version }}

      - name: Collect Tests Result
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: |
            ${{ github.workspace }}/build/reports/tests
            ${{ github.workspace }}/build/jacoco/

  # While ci.yml tests an older IntelliJ IDEA (IU) release than the newest, tests the newest release too, and says
  # whether ci.yml can move to it: if it passes, that's a one-line change of ci.yml, and if it doesn't, the log shows
  # what fails before a pull request runs into it (#2062)
  newest-release:
    needs: discover
    if: needs.discover.outputs.behind == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # Leaves the extracted IDEs out of the Actions cache, see ci.yml
          gradle-home-cache-excludes: |
            caches/transforms-4
            caches/*/transforms

      - name: Build with Gradle
        id: check
        run: ./gradlew check -PplatformType=IU -PplatformVersion=${{ needs.discover.outputs.newest-release }}

      - name: Say whether ci.yml can move to the newest release
        if: always()
        env:
          OUTCOME: ${{ steps.check.outcome }}
          NEWEST_RELEASE: ${{ needs.discover.outputs.newest-release }}
          CI_RELEASE: ${{ needs.discover.outputs.ci-release }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            MESSAGE="ci.yml tests IntelliJ IDEA $CI_RELEASE, and the newest release, $NEWEST_RELEASE, passes: ci.yml can move to it by changing the platformVersion of its matrix entry with platformType IU."
            echo "::notice title=ci.yml can move to $NEWEST_RELEASE::$MESSAGE"
            echo "> [!NOTE]" >> "$GITHUB_STEP_SUMMARY"
          else
            MESSAGE="ci.yml tests IntelliJ IDEA $CI_RELEASE, and the newest release, $NEWEST_RELEASE, doesn't pass ./gradlew check: see the log of this job before ci.yml moves to it."
            echo "::warning title=$NEWEST_RELEASE doesn't pass::$MESSAGE"
            echo "> [!WARNING]" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "> $MESSAGE" >> "$GITHUB_STEP_SUMMARY"

      - name: Collect Tests Result
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-newest-release
          path: |
            ${{ github.workspace }}/build/reports/tests
            ${{ github.workspace }}/build/jacoco/

  # Tests the newest build of each IntelliJ IDEA release that LSP4IJ supports and that neither ci.yml nor the job
  # newest-release tests, such as 2025.2, 2026.1 and 2026.2. ci.yml tests the oldest supported release, 2025.3 and the
  # newest release, which together run every version-dependent path of LSP4IJ. But the platform behaves differently in
  # the releases between them (#1300, #1636, #1648), whose users keep them after a newer release is out, when no other
  # job tests them any more.
  supported-releases:
    needs: discover
    if: needs.discover.outputs.untested-releases != '' && needs.discover.outputs.untested-releases != '[]'
    name: supported-release (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.discover.outputs.untested-releases) }}

    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # Leaves the extracted IDEs out of the Actions cache, see ci.yml
          gradle-home-cache-excludes: |
            caches/transforms-4
            caches/*/transforms

      - name: Build with Gradle
        env:
          PLATFORM_VERSION: ${{ matrix.version }}
        run: ./gradlew check -PplatformType=IU -PplatformVersion="$PLATFORM_VERSION"

      - name: Say that the release doesn't pass
        if: failure()
        env:
          PLATFORM_VERSION: ${{ matrix.version }}
        run: |
          MESSAGE="LSP4IJ supports IntelliJ IDEA $PLATFORM_VERSION, which ci.yml doesn't test, and it doesn't pass ./gradlew check: see the log of this job."
          echo "::warning title=$PLATFORM_VERSION doesn't pass::$MESSAGE"
          {
            echo "> [!WARNING]"
            echo "> $MESSAGE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect Tests Result
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-${{ matrix.version }}
          path: |
            ${{ github.workspace }}/build/reports/tests
            ${{ github.workspace }}/build/jacoco/
