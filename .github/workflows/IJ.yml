name: Validate against IJ versions
on:
  # Trigger the workflow on pushes to only the 'main' branch (this avoids duplicate checks being run e.g., for dependabot pull requests)
  push:
    branches: [ main ]
  # Trigger the workflow on any pull request
  pull_request:

# A new push to a pull request cancels the runs of its older commits. A push to main gets a group of its own, since a
# group keeps one pending run only and cancels any other: every commit of main is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Whether a pull request, or a push to main, changes only documentation, which needs no plugin verification
  changes:
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read

  # Run plugin structure verification along with IntelliJ Plugin Verifier
  verify:
    name: Verify plugin
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:

      # Free GitHub Actions Environment Disk Space, for main, which verifies the plugin against every release since the
      # oldest. A pull request verifies it against two IDEs only, for which the runner's free disk (87 GB in November
      # 2026) is plenty, so it skips this step, which takes 1.5 to 2.5 minutes.
      - name: Maximize Build Space
        if: github.event_name != 'pull_request'
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          preinstalled-runtimes: false
          large-packages: false

      # Check out current repository
      - name: Fetch Sources
        uses: actions/checkout@v7

      # Set up Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # Leaves the extracted IDEs out of the Actions cache, see ci.yml
          gradle-home-cache-excludes: |
            caches/transforms-4
            caches/*/transforms

      # Run Verify Plugin task and IntelliJ Plugin Verifier tool
      - name: Run Plugin Verification tasks
        run: |
          # A pull request is verified against the oldest and the newest release, where an API goes missing or is
          # removed, and main against all the releases since the oldest, and the current EAP. The newest release is the
          # one that ci.yml tests on.
          ./gradlew verifyPlugin -Dplugin.verifier.home.dir=~/.pluginVerifier ${{ github.event_name == 'pull_request' && '-PverifiedIdes=2024.2,2026.3' || '' }}
          REPORTS=$(cat ${{ github.workspace }}/build/reports/pluginVerifier/*/report.md | sed 's/^#/##/')
          echo "$REPORTS" >> "$GITHUB_STEP_SUMMARY"

      # Collect Plugin Verifier Result
      - name: Collect Plugin Verifier Result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pluginVerifier-result
          path: ${{ github.workspace }}/build/reports/pluginVerifier
