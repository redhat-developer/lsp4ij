name: Release Plugin

#Only one job at a time
concurrency: release

on:
  workflow_dispatch:
    inputs:
      publishToMarketPlace:
        description: 'Publish to JetBrains Marketplace ?'
        required: true
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'false'

jobs:
  # Prepare and publish the plugin to JetBrains Marketplace repository
  release:
    if: ${{ inputs.publishToMarketPlace == 'true'}}
    name: Publish to Marketplace
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Check out current repository
      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          # The history of main, to tell whether the release commit can still be pushed on top of it
          fetch-depth: 0

      # Set up Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # Leaves the extracted IDEs out of the Actions cache, see ci.yml
          gradle-home-cache-excludes: |
            caches/transforms-4
            caches/*/transforms

      - name: Set Release Version
        id: release_version
        shell: bash
        run: |
          PLUGIN_VERSION=$(./set_release_version.sh)
          echo "Release version: $PLUGIN_VERSION"
          echo "PLUGIN_VERSION=${PLUGIN_VERSION}" >> $GITHUB_ENV

      # A run which failed after it pushed the tag can be run again, or started again: it then goes on from the commit
      # that the tag points to, so that it builds the plugin that it published
      - name: Find an Earlier Tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$PLUGIN_VERSION" > /dev/null; then
            echo "$PLUGIN_VERSION is already tagged: going on from the tagged commit"
            git fetch -q origin "refs/tags/$PLUGIN_VERSION:refs/tags/$PLUGIN_VERSION"
            git checkout -q -f -B main "$PLUGIN_VERSION"
            echo "ALREADY_TAGGED=true" >> "$GITHUB_ENV"
          fi

      # Publish the plugin to JetBrains Marketplace, unless an earlier run of this release did
      - name: Publish Plugin to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: |
          # 23257 is the id of LSP4IJ on the JetBrains Marketplace, and the empty channel is the default one. If the
          # Marketplace can't be asked, publishPlugin runs, and fails if the version is already there.
          if curl -sSf "https://plugins.jetbrains.com/api/plugins/23257/updates?channel=&size=100" \
              | jq -e --arg version "$PLUGIN_VERSION" 'any(.[]; .version == $version)' > /dev/null; then
            echo "$PLUGIN_VERSION is already on the Jetbrains Marketplace: only building it, for the GitHub release"
            ./gradlew buildPlugin -PpluginVersion="$PLUGIN_VERSION"
          else
            ./gradlew publishPlugin -PpluginVersion="$PLUGIN_VERSION" -Pchannel=default
            echo "Published $PLUGIN_VERSION to the Jetbrains Marketplace"
          fi

      - name: Tag Release
        if: env.ALREADY_TAGGED != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git commit -sam "chore(skip-release): set version to $PLUGIN_VERSION"
          git tag $PLUGIN_VERSION
          git push origin $PLUGIN_VERSION

      # Set next SNAPSHOT version, unless main already has it, from an earlier run of this release or from a commit
      - name: Increment Plugin Version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git fetch -q origin main
          MAIN_VERSION=$(git show origin/main:gradle.properties | grep '^pluginVersion=' | cut -d'=' -f2)
          if [ "$MAIN_VERSION" != "$PLUGIN_VERSION-SNAPSHOT" ]; then
            echo "main is already at $MAIN_VERSION"
          else
            if ! git merge-base --is-ancestor origin/main HEAD; then
              # main has moved on since the release commit, which can then not be pushed on top of it: the tag keeps
              # that commit, and main only gets the next version
              git checkout -q -B main origin/main
            fi
            NEW_VERSION=$(./increment_version.sh)
            echo "Set $NEW_VERSION in gradle.properties"
            git commit -sam "chore(skip-release): set version to $NEW_VERSION"
            git push origin main
          fi

      - name: Simple conventional changelog
        uses: redhat-developer/simple-conventional-changelog@d1060338b82efbffd09263457a470151597aa8a0 #0.0.13
        id: changelog
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          current-tag: ${{env.PLUGIN_VERSION}}
          types-mapping: 'feat:Features,fix:Bug Fixes,docs:Documentation,refactor:Refactoring,build:Build,chore:Other'

      # Create a new Github release, unless an earlier run of this release did
      - name: Create Github Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${PLUGIN_VERSION}" > /dev/null 2>&1; then
            echo "The GitHub release ${PLUGIN_VERSION} already exists"
          else
            gh release create ${PLUGIN_VERSION} \
              --title "${PLUGIN_VERSION}" \
              --notes "$(cat << 'EOM'
          ${{ steps.changelog.outputs.changelog }}
          EOM
          )"
          fi

      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --clobber replaces the asset that an earlier run of this release uploaded
        run: gh release upload ${PLUGIN_VERSION} ./build/distributions/* --clobber
