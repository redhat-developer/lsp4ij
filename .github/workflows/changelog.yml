name: Generate changelog
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of release'
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Simple conventional changelog
        uses: redhat-developer/simple-conventional-changelog@d1060338b82efbffd09263457a470151597aa8a0 #0.0.13
        id: changelog
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          current-tag: '${{ github.event.inputs.tag }}'
          types-mapping: 'feat:Features,fix:Bug Fixes,docs:Documentation,refactor:Refactoring,chore:Other'
